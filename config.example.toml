# ahnara Configuration Template
# Copy to ~/.ahnara/config.toml and fill in your API keys

[agent]
name = "ahnara"
default_model = "stepfun-ai/step-3.5-flash"
max_tokens = 8192
temperature = 1.0
max_tool_iterations = 100
context_window_tokens = 20000
timezone = "UTC"

[providers]
connection_pool_size = 32
request_timeout_secs = 120

[providers.primary]
name = "nvidia"
api_base = "https://integrate.api.nvidia.com/v1"
api_key = ""  # Set via NVIDIA_API_KEY env var or fill here

# Fallback providers (optional)
# [[providers.fallbacks]]
# name = "openai"
# api_base = "https://api.openai.com/v1"
# api_key = ""  # Set via OPENAI_API_KEY env var
#
# [[providers.fallbacks]]
# name = "anthropic"
# api_base = "https://api.anthropic.com/v1"
# api_key = ""  # Set via ANTHROPIC_API_KEY env var
#
# [[providers.fallbacks]]
# name = "gemini"
# api_base = "https://generativelanguage.googleapis.com/v1beta/openai"
# api_key = ""  # Set via GOOGLE_AI_STUDIO_KEY env var

[memory]
database_path = "~/.ahnara/memory.db"
hot_cache_size = 1000
session_max_messages = 100
consolidation_interval_secs = 300

[channels.telegram]
enabled = false
token = ""  # Set via TELEGRAM_BOT_TOKEN env var
group_policy = "mention"

[channels.discord]
enabled = false
token = ""  # Set via DISCORD_BOT_TOKEN env var
allowed_guilds = []

[channels.slack]
enabled = false
bot_token = ""
app_token = ""

[tools]
exec_enabled = true
exec_timeout_secs = 60
restrict_to_workspace = true
web_search_enabled = true
web_search_provider = "brave"

[server]
host = "0.0.0.0"
port = 18789
cors_enabled = true