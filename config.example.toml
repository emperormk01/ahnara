# ahnara Configuration Template
# Copy to ~/.ahnara/config.toml and fill in your API keys

[agent]
name = "ahnara"
default_model = "stepfun-ai/step-3.5-flash"
max_tokens = 8192
temperature = 1.0
max_tool_iterations = 100
nudge_after_tool_calls = 10
context_window_tokens = 20000
recent_history_turns = 60
tool_output_max_chars = 10000
timezone = "UTC"

[providers]
active = ""
connection_pool_size = 32
request_timeout_secs = 60

[sub_agents]
enabled = true
min_complexity = 50
max_budget = 30000
max_concurrent = 5
timeout_secs = 60
fallback_on_error = true
track_cost = true

[[providers.providers]]
name = "nvidia"
api_base = "https://integrate.api.nvidia.com/v1"
api_key = ""  # Set via NVIDIA_API_KEY env var or fill here

# Fallback providers (optional, same table format)
# [[providers.providers]]
# name = "openai"
# api_base = "https://api.openai.com/v1"
# api_key = ""  # Set via OPENAI_API_KEY env var
#
# [[providers.providers]]
# name = "anthropic"
# api_base = "https://api.anthropic.com/v1"
# api_key = ""  # Set via ANTHROPIC_API_KEY env var
#
# [[providers.providers]]
# name = "gemini"
# api_base = "https://generativelanguage.googleapis.com/v1beta/openai"
# api_key = ""  # Set via GOOGLE_AI_STUDIO_KEY env var

[memory]
database_path = "~/.ahnara/memory.db"
hot_cache_size = 1000
compaction_enabled = true
compaction_threshold = 40
compaction_keep_recent = 10
compaction_cooldown_secs = 300
reflection_enabled = true
reflection_min_messages = 5
reflection_cooldown_secs = 300
reflection_interval_secs = 300

[channels.telegram]
enabled = false
token = ""  # Set via TELEGRAM_BOT_TOKEN env var
group_policy = "mention"

[channels.discord]
enabled = false
token = ""  # Set via DISCORD_BOT_TOKEN env var
allowed_guilds = []

[server]
host = "0.0.0.0"
port = 18789
